<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/choke.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18171C" />
    <meta
      name="description"
      content="Choke! — osu! 二次创作的 PVP / PVE 双轨制节奏卡牌对战游戏。"
    />
    <script>
      // 首帧前按 ThemeProvider 的规则设好主题，避免亮色用户先闪一下暗色
      ;(() => {
        const saved = localStorage.getItem("theme")
        const dark =
          /battle(-sim)?\/*$/.test(location.pathname) ||
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      })()
    </script>
    <title>Choke! — 节奏卡牌对决</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
